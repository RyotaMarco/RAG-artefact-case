[project]
name = "emporio-music-agent"
version = "0.1.0"
description = "Source-grounded customer support for Emporio da Musica."
requires-python = ">=3.12,<3.13"
dependencies = [
  "agno>=2.2",
  "anthropic>=0.75",
  "httpx>=0.28",
  "huggingface-hub>=0.34",
  "numpy>=2.2",
  "pypdf>=6.0",
  "rank-bm25>=0.2.2",
  "sqlalchemy>=2.0",
  "sqlglot>=28",
  "streamlit>=1.50",
  "tokenizers>=0.22",
]

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8.4", "pytest-playwright>=0.7", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "app.py", "tests"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "D100", "D101", "D102", "D103", "D205"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: uses paid external APIs and requires explicit opt-in", "e2e: browser tests"]
