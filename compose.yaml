services:
  app:
    build:
      context: .
      target: production
    ports:
      - target: 8501
        published: "${APP_PORT:-8501}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # Pass shell/.env values through; absent settings keep the Python defaults.
      CLAUDE_MODEL:
      CLAUDE_TIMEOUT_SECONDS:
      CLAUDE_MAX_TOKENS:
      MAX_TOOL_CALLS:
      STORE_TIMEZONE:
      EMBEDDING_MODEL:
      EMBEDDING_BASE_URL:
      EMBEDDING_DIMENSIONS:
      EMBEDDING_TIMEOUT_SECONDS:
      EMBEDDING_REQUESTS_PER_MINUTE:
      EMBEDDING_TOKENS_PER_MINUTE:
      EMBEDDING_BATCH_TOKENS:
      EMBEDDING_TOKENIZER_MODEL:
      EMBEDDING_TOKENIZER_REVISION:
      CHUNK_TARGET_TOKENS:
      CHUNK_MAX_TOKENS:
      CHUNK_OVERLAP_TOKENS:
      DATA_DIR: /app/data
      RUNTIME_DIR: /app/runtime
    volumes:
      - type: bind
        source: "${DATA_DIR:-./data}"
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: runtime_data
        target: /app/runtime
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 128
    init: true

volumes:
  runtime_data:
