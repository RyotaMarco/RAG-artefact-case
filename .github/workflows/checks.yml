name: Checks

on:
  push:
    branches:
      - main
      - Development
      - 'feature/**'
      - 'test/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.13.6'
  PYTHON_VERSION: '3.12.16'

jobs:
  branch-flow:
    name: branch-flow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/check_branch_flow.py

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pyright
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked playwright install --with-deps chromium
      - run: uv run --locked pytest -m "not live"

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose deployment settings
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          names = {
              line.split("=", 1)[0]
              for line in Path(".env.example").read_text().splitlines()
              if line and not line.startswith("#")
          }

          def resolve(overrides: dict[str, str], dotenv_text: str = "") -> dict[str, object]:
              """Resolve real Compose settings without a daemon or API credentials."""
              environment = {key: value for key, value in os.environ.items() if key not in names}
              environment.update(overrides)
              with tempfile.TemporaryDirectory() as directory:
                  dotenv = Path(directory) / "deployment.env"
                  dotenv.write_text(dotenv_text)
                  result = subprocess.run(
                      ["docker", "compose", "--env-file", str(dotenv), "config", "--format", "json"],
                      check=True, capture_output=True, text=True, env=environment,
                  )
              return json.loads(result.stdout)["services"]["app"]

          default = resolve({})
          assert default["environment"].get("EMBEDDING_BASE_URL") is None
          assert default["environment"]["VOYAGE_API_KEY"] == ""
          assert "HF_TOKEN" not in default["environment"]
          assert default["environment"]["DATA_DIR"] == "/app/data"
          assert default["environment"]["RUNTIME_DIR"] == "/app/runtime"
          assert default["ports"][0]["published"] == "8501"
          assert default["ports"][0]["target"] == 8501
          assert default["ports"][0]["host_ip"] == "127.0.0.1"
          runtime = next(volume for volume in default["volumes"] if volume["target"] == "/app/runtime")
          assert runtime["type"] == "volume" and runtime["source"] == "runtime_data"

          dotenv = (
              "VOYAGE_API_KEY=fixture-voyage-key\n"
              "EMBEDDING_MODEL=custom-voyage-model\n"
              "EMBEDDING_BASE_URL=https://embeddings.example.test/v1\n"
              "EMBEDDING_DIMENSIONS=512\n"
              "EMBEDDING_REQUESTS_PER_MINUTE=6\n"
              "EMBEDDING_TOKENS_PER_MINUTE=12000\n"
              "EMBEDDING_BATCH_TOKENS=6000\n"
              "EMBEDDING_TOKENIZER_MODEL=\n"
              "EMBEDDING_TOKENIZER_REVISION=\n"
              "CHUNK_TARGET_TOKENS=256\n"
              "CHUNK_MAX_TOKENS=384\n"
              "CHUNK_OVERLAP_TOKENS=0\n"
          )
          from_file = resolve({}, dotenv)["environment"]
          assert from_file["VOYAGE_API_KEY"] == "fixture-voyage-key"
          assert from_file["EMBEDDING_MODEL"] == "custom-voyage-model"
          assert from_file["EMBEDDING_BASE_URL"] == "https://embeddings.example.test/v1"
          assert from_file["EMBEDDING_DIMENSIONS"] == "512"
          assert from_file["EMBEDDING_REQUESTS_PER_MINUTE"] == "6"
          assert from_file["EMBEDDING_TOKENS_PER_MINUTE"] == "12000"
          assert from_file["EMBEDDING_BATCH_TOKENS"] == "6000"
          assert from_file["EMBEDDING_TOKENIZER_MODEL"] == ""
          assert from_file["EMBEDDING_TOKENIZER_REVISION"] == ""
          assert from_file["CHUNK_TARGET_TOKENS"] == "256"
          assert from_file["CHUNK_MAX_TOKENS"] == "384"
          assert from_file["CHUNK_OVERLAP_TOKENS"] == "0"
          custom = resolve({
              "APP_PORT": "8601", "DATA_DIR": "./data/custom inputs",
              "VOYAGE_API_KEY": "fixture-shell-key",
              "EMBEDDING_BASE_URL": "https://shell.example.test/v1",
          }, dotenv)
          assert custom["environment"]["VOYAGE_API_KEY"] == "fixture-shell-key"
          assert custom["environment"]["EMBEDDING_BASE_URL"] == "https://shell.example.test/v1"
          assert custom["environment"]["DATA_DIR"] == "/app/data"
          assert custom["environment"]["RUNTIME_DIR"] == "/app/runtime"
          assert custom["ports"][0]["published"] == "8601"
          assert custom["ports"][0]["target"] == 8501
          source = next(volume for volume in custom["volumes"] if volume["target"] == "/app/data")
          assert source["source"] == str(Path("data/custom inputs").resolve())
          assert source["type"] == "bind" and source["read_only"] is True
          assert source.get("bind", {}).get("create_host_path", False) is False
          PY
      - name: Build production image
        run: docker build --target production --tag emporio-agent:ci .
      - name: Check production health
        shell: bash
        run: |
          docker run --detach --name emporio-health --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount type=volume,source=emporio-ci-runtime,target=/app/runtime \
            --cap-drop ALL --security-opt no-new-privileges:true \
            emporio-agent:ci
          for attempt in {1..18}; do
            state=$(docker inspect --format '{{.State.Health.Status}}' emporio-health)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then break; fi
            sleep 5
          done
          docker logs emporio-health
          exit 1
      - name: Build browser test image
        run: docker build --target test --tag emporio-agent:test .
      - name: Run container browser tests
        run: docker run --rm --init --ipc=host emporio-agent:test uv run --no-sync pytest -m "e2e and not live"
      - name: Stop smoke container
        if: always()
        run: docker rm --force emporio-health || true
